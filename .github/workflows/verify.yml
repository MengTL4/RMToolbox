name: verify

# The build is Windows-only (NW.js + native DLL injectors), so the whole matrix
# is windows-latest. These jobs deliberately stop short of launching a real game:
# that needs a game install and stays on a developer machine. What runs here is
# everything that must hold before a release is packed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Ruby is required, not optional: three test files exercise the RGSS
      # adapters through Ruby fixtures and used to skip silently when it was
      # missing. Without this step the suite would be green having run none of
      # that coverage.
      #
      # `-e "exit 0"` mirrors the probe tools/lib/ruby-fixture.mjs uses: a
      # `ruby` that merely EXISTS is not enough (a shim on PATH would satisfy
      # `--version`), so assert it actually executes Ruby before the suite
      # depends on it. This fails here, with a clear cause, instead of surfacing
      # as a confusing error inside test-event-tools.mjs.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Ruby actually runs
        shell: pwsh
        run: |
          ruby -e "exit 0"
          if ($LASTEXITCODE -ne 0) { throw "ruby -e 'exit 0' failed; RGSS fixtures cannot run" }
          ruby --version

      - run: npm ci

      - name: Type check and build the frontend
        run: npm run gui:build

      - name: Type check
        run: npm run typecheck

      - name: Regression suite
        run: npm test

      - name: Command reference is up to date
        run: node tools/commands-doc.mjs --check

      # Formatting is a reviewed convention here, so it is enforced rather than
      # left to taste. runtime/bridge/src/parts/** is excluded via
      # .prettierignore — those files are IIFE fragments Prettier cannot parse.
      - name: Formatting
        run: npm run format:check

  # The committed injector binaries are what users actually run, and nothing in
  # the test suite rebuilds them. Rebuilding from runtime/inject/src in CI is the
  # cheapest honest check that they match their source.
  injectors:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      # Only install the toolchain here. The build itself runs under pwsh
      # (below): `node` comes from setup-node on the Windows PATH, and MSYS2's
      # shell does not inherit it, so running node inside `shell: msys2` fails
      # with "node: command not found" (exit 127). tools/build-inject.mjs finds
      # gcc/ld.lld through the common msys64 roots when they are not on PATH, so
      # installing here and building from pwsh is the combination that works.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-i686-gcc
            mingw-w64-ucrt-x86_64-lld

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rebuild the injectors from source
        # MSYS2 for the toolchain, inherited Windows PATH for node.
        #
        # These two requirements pull in opposite directions and each failure
        # mode is distinct, both observed on this workflow:
        #   - `shell: pwsh` cannot see the msys2-installed i686 toolchain (only
        #     the runner's preinstalled C:\mingw64 is on PATH), so the build dies
        #     with "win32: toolchain NOT found".
        #   - `shell: msys2` cannot see node from setup-node, so it dies earlier
        #     with exit 127 "node: command not found".
        # MSYS2_PATH_TYPE=inherit hands the msys2 shell the Windows PATH, making
        # both reachable.
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: node tools/build-inject.mjs

      - name: Report drift against the committed binaries
        shell: pwsh
        run: |
          $drift = git status --porcelain runtime/inject/bin
          if ($drift) {
            Write-Host "::warning::committed injector binaries differ from a fresh build from runtime/inject/src"
            Write-Host $drift
          } else {
            Write-Host "committed injector binaries match a fresh build"
          }
