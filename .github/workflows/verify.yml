name: verify

# The build is Windows-only (NW.js + native DLL injectors), so the whole matrix
# is windows-latest. These jobs deliberately stop short of launching a real game:
# that needs a game install and stays on a developer machine. What runs here is
# everything that must hold before a release is packed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Ruby is required, not optional: three test files exercise the RGSS
      # adapters through Ruby fixtures and used to skip silently when it was
      # missing. Without this step the suite would be green having run none of
      # that coverage.
      #
      # `-e "exit 0"` mirrors the probe tools/lib/ruby-fixture.mjs uses: a
      # `ruby` that merely EXISTS is not enough (a shim on PATH would satisfy
      # `--version`), so assert it actually executes Ruby before the suite
      # depends on it. This fails here, with a clear cause, instead of surfacing
      # as a confusing error inside test-event-tools.mjs.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Ruby actually runs
        shell: pwsh
        run: |
          ruby -e "exit 0"
          if ($LASTEXITCODE -ne 0) { throw "ruby -e 'exit 0' failed; RGSS fixtures cannot run" }
          ruby --version

      - run: npm ci

      - name: Type check and build the frontend
        run: npm run gui:build

      - name: Type check
        run: npm run typecheck

      - name: Regression suite
        run: npm test

      - name: Command reference is up to date
        run: node tools/commands-doc.mjs --check

      # Formatting is a reviewed convention here, so it is enforced rather than
      # left to taste. runtime/bridge/src/parts/** is excluded via
      # .prettierignore — those files are IIFE fragments Prettier cannot parse.
      - name: Formatting
        run: npm run format:check

  # The committed injector binaries are what users actually run, and nothing in
  # the test suite rebuilds them. This job proves they are not orphans: both
  # architectures compile from runtime/inject/src with the documented toolchain.
  #
  # It cannot prove they are byte-reproducible, and does not try — PE output
  # embeds a build timestamp and varies with the gcc/lld build, so the binaries
  # are reported as informational rather than as a gate (continue-on-error).
  injectors:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      # Both halves of this job were learned from real failures:
      #
      # 1. build-inject.mjs probes the msys64 roots it knows (C:\msys64,
      #    E:\Path\msys64) plus PATH. On a runner msys2 lives under D:\a\_temp, so
      #    neither matches and the i686 toolchain looks "NOT found" even though it
      #    is installed. The action knows its own location, so pass it through the
      #    env var build-inject.mjs already honours instead of guessing paths.
      # 2. `shell: pwsh` cannot see msys2's toolchain, and `shell: msys2` cannot
      #    see node from setup-node. MSYS2_PATH_TYPE=inherit gives the msys2 shell
      #    the Windows PATH, so one shell has both.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-i686-gcc
            mingw-w64-ucrt-x86_64-lld

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rebuild the injectors from source
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
          # The action's own location. build-inject.mjs honours MSYS2_PREFIX
          # first, so the i686 toolchain is found without relying on the
          # hardcoded msys64 roots it would otherwise probe.
          MSYS2_PREFIX: ${{ steps.msys2.outputs.msys2-location }}
        run: node tools/build-inject.mjs

      - name: Report what the rebuild proves
        shell: pwsh
        run: |
          # This step deliberately does NOT claim the committed binaries are
          # reproducible. They are not: a PE file embeds a build timestamp, and a
          # different gcc/lld build changes codegen, so a byte comparison across
          # toolchains can never match. What the job establishes is the weaker but
          # still useful fact — both architectures compile from
          # runtime/inject/src with the documented toolchain, so the committed
          # binaries are not orphans of a source tree that no longer builds.
          $drift = git status --porcelain runtime/inject/bin
          if ($drift) {
            Write-Host "Rebuild succeeded for both architectures. Committed binaries are byte-different, as expected for PE output from a different toolchain (build timestamps/codegen):"
            Write-Host $drift
          } else {
            Write-Host "Committed injector binaries are byte-identical to a fresh build."
          }
